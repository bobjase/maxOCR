# R33b candidate build plan: primary alphabet only, one weight/width, upright, unhinted.
[buildPlans.MaxOCRCand]
family = "MaxOCR Cand"
spacing = "fixed"
noLigation = true
noCvSs = true
exportGlyphNames = true

[buildPlans.MaxOCRCand.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.MaxOCRCand.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.MaxOCRCand.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.MaxOCRCand.subset.include]
text = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"

# R47a / R33b comparison: same plan, full character set.
[buildPlans.MaxOCRFull]
family = "MaxOCR Full"
spacing = "fixed"
noLigation = true
noCvSs = true
exportGlyphNames = true
weights.inherits = "buildPlans.MaxOCRCand"
widths.inherits = "buildPlans.MaxOCRCand"
slopes.inherits = "buildPlans.MaxOCRCand"
