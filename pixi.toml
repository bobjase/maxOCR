[workspace]
name = "maxocr"
channels = ["conda-forge"]
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "12" }]

[dependencies]
python = "3.12.*"
tesseract = "5.*"
tesserocr = "*"
nodejs = "22.*"
numpy = "*"
pillow = "*"
opencv = "*"
freetype-py = "*"
uharfbuzz = "*"
fonttools = "*"
pytest = "*"
pyyaml = "*"
pandas = "*"
pyarrow = "*"
matplotlib = "*"
scipy = "*"
shapely = "*"
cma = "*"
timm = "*"
pytorch-lightning = "*"
nltk = "*"
scikit-image = "*"
onnxruntime = { version = "*", build = "*cuda*" }
pytorch = { version = "*", build = "*cuda*" }

[tasks]
risky = "pytest -v tests/risky"
test = "pytest -q tests"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"
